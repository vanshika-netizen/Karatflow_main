<!doctype html>
<title>KaratFlow Build Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/site.css">
<main class="auth-card">
  <p class="eyebrow">KaratFlow</p>
  <h1>Build dashboard</h1>
  <p>Sign in to trigger and monitor Android builds.</p>
  {% for message in get_flashed_messages() %}<p class="error">{{ message }}</p>{% endfor %}
  <form method="post">
    <label>Password <input name="password" type="password" required autofocus></label>
    <button type="submit">Sign in</button>
  </form>
</main>
