name: Build Android APK on server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karatflow-server-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish APK
    runs-on: [self-hosted, linux, flutter-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Display build tools
        run: |
          java -version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Publish latest APK on server
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          target_dir="/var/www/app-downloads"
          temporary_file="$(mktemp "${target_dir}/.latest.apk.XXXXXX")"
          install -m 0644 "${apk}" "${temporary_file}"
          mv -f "${temporary_file}" "${target_dir}/latest.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "server-android-${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-release.apk#app-release.apk \
            --title "Server Android build #${{ github.run_number }}" \
            --generate-notes \
            --latest
